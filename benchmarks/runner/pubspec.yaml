name: alphax_benchmark_runner
description: Reproducible AlphaX Phase 0 transport benchmark runner.
publish_to: none
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  alphax_benchmark_client:
    path: ../client
  alphax_benchmark_server:
    path: ../server
  alphax_dart_io_prototype:
