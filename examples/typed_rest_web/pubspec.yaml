    path: ../../packages/alphax
  alphax_generator:
    path: ../../packages/alphax_generator
  alphax_test:
    path: ../../packages/alphax_test
  build_runner: ^2.16.0
  lints: ^5.1.1
  test: ^1.31.1

dependency_overrides:
  alphax:
    path: ../../packages/alphax
