name: alphax_native
description: Experimental native transport boundary for AlphaX.
version: 0.1.0
repository: https://github.com/auvana-ventures/alphax
issue_tracker: https://github.com/auvana-ventures/alphax/issues
topics:
  - networking
  - http
  - ffi
  - dart
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  alphax: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  alphax_test: ^0.1.0
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        package: com.auvana.ventures.alphax
        pluginClass: AlphaXNativePlugin
      ios:
        pluginClass: AlphaXNativePlugin
      macos:
        pluginClass: AlphaXNativePlugin
