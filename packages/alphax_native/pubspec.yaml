name: alphax_native
description: Native Flutter HTTP transports for AlphaX using Android Cronet, Apple URLSession, and a Dart IO fallback.
version: 1.0.0
homepage: https://github.com/auvana-ventures/alphax
repository: https://github.com/auvana-ventures/alphax
issue_tracker: https://github.com/auvana-ventures/alphax/issues
topics:
  - networking
  - http
  - flutter
  - cronet
  - urlsession
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  alphax: ^1.0.0
  flutter:
    sdk: flutter
  web_socket: ^1.0.1

dev_dependencies:
  alphax_test: ^1.0.0
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        package: com.auvana.ventures.alphax
        pluginClass: AlphaXNativePlugin
      ios:
        pluginClass: AlphaXNativePlugin
      macos:
        pluginClass: AlphaXNativePlugin
