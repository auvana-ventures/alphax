name: alphax_generator
description: Dev-time source generator for typed REST clients that call AlphaXClient directly.
version: 1.0.0
homepage: https://github.com/auvana-ventures/alphax
repository: https://github.com/auvana-ventures/alphax
issue_tracker: https://github.com/auvana-ventures/alphax/issues
topics:
  - networking
  - http
  - code-generation
  - dart
resolution: workspace
