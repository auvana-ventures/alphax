  build_config: ^1.3.2
  dart_style: ^3.1.13
  source_gen: ">=4.2.4 <4.3.0"

dev_dependencies:
  build_runner: ^2.16.0
  lints: ^5.1.1
  source_gen_test: ^1.3.7
  test: ^1.25.0
